<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TchanzDex - Gameplay - Casual & Competitiva</title>
  <meta name="description" content="TchanzDex - Pokédex de alta performance baseada em snapshot local com modelos 3D, artes em HD, linha evolutiva e builds competitivas.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/style.css">
</head>
<body class="dark-theme">
  <div id="app">
    <!-- Header -->
    <header class="app-header">
      <div class="header-container">
        <div class="logo-group">
          <div class="pokeball-icon">
            <div class="pokeball-top"></div>
            <div class="pokeball-center"></div>
            <div class="pokeball-bottom"></div>
          </div>
          <div>
            <h1 class="app-title">Tchanz<span class="highlight">Dex</span></h1>
            <p class="app-subtitle">Gameplay - Casual & Competitiva</p>
          </div>
        </div>

        <div class="header-actions">
          <button id="view-mode-btn" class="toggle-filters-btn secondary" title="Alternar entre Grade e Planilha de Stats">
            📊 <span id="view-mode-text">Modo Planilha</span>
          </button>

          <button id="toggle-filters-btn" class="toggle-filters-btn" title="Esconder ou mostrar barra de filtros">
            🎛️ <span id="toggle-filters-text">Filtros</span>
          </button>

          <div class="stats-badge">
            <span class="pulse-dot"></span>
            <span id="total-count-text">Carregando...</span>
          </div>
        </div>
      </div>

      <!-- Controls & Filter Bar -->
      <div id="filter-bar" class="filter-bar">
        <div class="search-box">
          <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input type="text" id="search-input" placeholder="Buscar Nome, #, Golpe ou Habilidade..." autocomplete="off">
          <button id="clear-search-btn" class="icon-btn hidden" title="Limpar busca">&times;</button>
        </div>

        <div class="filter-item">
          <select id="gen-select" class="type-dropdown">
            <option value="">Todas Gerações</option>
            <option value="gen1">Gen 1: Kanto (#001-#151)</option>
            <option value="gen2">Gen 2: Johto (#152-#251)</option>
            <option value="gen3">Gen 3: Hoenn (#252-#386)</option>
            <option value="gen4">Gen 4: Sinnoh (#387-#493)</option>
            <option value="gen5">Gen 5: Unova (#494-#649)</option>
            <option value="gen6">Gen 6: Kalos (#650-#721)</option>
            <option value="gen7">Gen 7: Alola (#722-#809)</option>
            <option value="gen8">Gen 8: Galar/Hisui (#810-#905)</option>
            <option value="gen9">Gen 9: Paldea (#906+)</option>
          </select>
        </div>

        <div class="filter-item">
          <select id="type-select" class="type-dropdown">
            <option value="">Todos os Tipos</option>
            <option value="normal">Normal</option>
            <option value="fire">Fire 🔥</option>
            <option value="water">Water 💧</option>
            <option value="grass">Grass 🌿</option>
            <option value="electric">Electric ⚡</option>
            <option value="ice">Ice ❄️</option>
            <option value="fighting">Fighting 🥊</option>
            <option value="poison">Poison ☠️</option>
            <option value="ground">Ground ⛰️</option>
            <option value="flying">Flying 🕊️</option>
            <option value="psychic">Psychic 🔮</option>
            <option value="bug">Bug 🐛</option>
            <option value="rock">Rock 🪨</option>
            <option value="ghost">Ghost 👻</option>
            <option value="dragon">Dragon 🐉</option>
            <option value="dark">Dark 🌙</option>
            <option value="steel">Steel 🛡️</option>
            <option value="fairy">Fairy ✨</option>
          </select>
        </div>

        <div class="filter-item">
          <select id="sort-select" class="type-dropdown">
            <option value="id-asc"># Menor ➔ Maior</option>
            <option value="id-desc"># Maior ➔ Menor</option>
            <option value="name-asc">Nome (A ➔ Z)</option>
            <option value="name-desc">Nome (Z ➔ A)</option>
            <option value="bst-desc">Total BST (Fortes ➔ Fracos)</option>
            <option value="bst-asc">Total BST (Fracos ➔ Fortes)</option>
            <option value="hp-desc">HP (Maior ➔ Menor)</option>
            <option value="attack-desc">Ataque Físico (Maior ➔ Menor)</option>
            <option value="defense-desc">Defesa Física (Maior ➔ Menor)</option>
            <option value="special-attack-desc">Ataque Especial (Maior ➔ Menor)</option>
            <option value="special-defense-desc">Defesa Especial (Maior ➔ Menor)</option>
            <option value="speed-desc">Velocidade (Maior ➔ Menor)</option>
          </select>
        </div>

        <button id="global-shiny-btn" class="reset-btn shiny-main-btn" title="Alternar artes para modo Shiny em toda a página">
          ✨ Shiny: OFF
        </button>

        <button id="global-3d-btn" class="reset-btn shiny-main-btn btn-3d" title="Alternar para modelos 3D animados na grade principal">
          👾 3D: OFF
        </button>

        <button id="reset-all-btn" class="reset-btn">
          🔄 Limpar
        </button>
      </div>
    </header>

    <!-- Main Content Container -->
    <main class="main-content">
      <!-- Grid View -->
      <div id="pokemon-grid" class="pokemon-grid">
        <!-- Pokémon cards rendered dynamically -->
      </div>

      <!-- Spreadsheet / Table View -->
      <div id="pokemon-table-container" class="table-container hidden">
        <div class="table-responsive">
          <table class="stats-table">
            <thead>
              <tr>
                <th data-sort="id" class="sortable"># <span class="sort-icon">↕</span></th>
                <th>Arte</th>
                <th data-sort="name" class="sortable">Nome <span class="sort-icon">↕</span></th>
                <th>Tipos</th>
                <th data-sort="hp" class="sortable">HP <span class="sort-icon">↕</span></th>
                <th data-sort="attack" class="sortable">Atk <span class="sort-icon">↕</span></th>
                <th data-sort="defense" class="sortable">Def <span class="sort-icon">↕</span></th>
                <th data-sort="special-attack" class="sortable">SpA <span class="sort-icon">↕</span></th>
                <th data-sort="special-defense" class="sortable">SpD <span class="sort-icon">↕</span></th>
                <th data-sort="speed" class="sortable">Spe <span class="sort-icon">↕</span></th>
                <th data-sort="bst" class="sortable bst-header">BST Total <span class="sort-icon">↕</span></th>
              </tr>
            </thead>
            <tbody id="table-body">
              <!-- Table rows rendered dynamically -->
            </tbody>
          </table>
        </div>
      </div>

      <div id="empty-state" class="empty-state hidden">
        <div class="empty-icon">🔍</div>
        <h3>Nenhum Pokémon encontrado</h3>
        <p>Tente ajustar os termos da sua pesquisa ou selecione outra geração/tipo elementar.</p>
        <button id="empty-reset-btn" class="reset-btn primary">Resetar Busca</button>
      </div>
    </main>

    <!-- Floating Back to Top Button -->
    <button id="back-to-top-btn" class="back-to-top-btn hidden" title="Voltar ao Topo">
      ⬆️
    </button>

    <!-- Detailed Modal with Prev/Next Navigation -->
    <div id="pokemon-modal" class="modal-backdrop hidden" role="dialog" aria-modal="true">
      <button id="modal-prev-btn" class="modal-nav-btn prev" title="Pokémon Anterior (Seta Esquerda ◀)">
        ◀
      </button>

      <div class="modal-card">
        <button id="close-modal-btn" class="modal-close" aria-label="Fechar modal">&times;</button>
        <div id="modal-content">
          <!-- Modal content rendered dynamically -->
        </div>
      </div>

      <button id="modal-next-btn" class="modal-nav-btn next" title="Próximo Pokémon (Seta Direita ▶)">
        ▶
      </button>
    </div>
  </div>

  <script type="module" src="/src/app.ts"></script>
</body>
</html>
